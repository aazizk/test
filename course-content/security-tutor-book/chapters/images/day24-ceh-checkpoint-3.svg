<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <text x="370" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Checkpoint #3: Closed vs. Filtered, and Four Resolved Watch-Items</text>

  <!-- Closed port -->
  <rect x="30" y="55" width="300" height="110" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="180" y="78" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">CLOSED PORT</text>
  <text x="180" y="100" font-size="13" text-anchor="middle" fill="#1a1a1a">SYN probe --&gt; RST received</text>
  <text x="180" y="122" font-size="13" text-anchor="middle" fill="#1a1a1a">Host reachable, actively</text>
  <text x="180" y="140" font-size="13" text-anchor="middle" fill="#1a1a1a">says "nobody's listening"</text>
  <text x="180" y="158" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a1a">Definite signal</text>

  <!-- Filtered port -->
  <rect x="410" y="55" width="300" height="110" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="560" y="78" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FILTERED PORT</text>
  <text x="560" y="100" font-size="13" text-anchor="middle" fill="#1a1a1a">SYN probe --&gt; no response</text>
  <text x="560" y="122" font-size="13" text-anchor="middle" fill="#1a1a1a">Firewall silently dropped it --</text>
  <text x="560" y="140" font-size="13" text-anchor="middle" fill="#1a1a1a">no RST, no SYN-ACK, nothing</text>
  <text x="560" y="158" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a1a">Uncertain signal (BLOCKED)</text>

  <line x1="330" y1="110" x2="410" y2="110" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="370" y="103" font-size="12" text-anchor="middle" fill="#1a1a1a">vs.</text>

  <!-- Four watch items -->
  <text x="370" y="205" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Four Standing Watch-Items -- All Resolved This Session</text>

  <rect x="30" y="225" width="330" height="70" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="195" y="250" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">SameSite=Lax mechanism</text>
  <text x="195" y="270" font-size="12" text-anchor="middle" fill="#1a1a1a">Top-level navigation rule, not GET-vs-POST</text>

  <rect x="380" y="225" width="330" height="70" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="545" y="250" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Concurrency / overlapping delays</text>
  <text x="545" y="270" font-size="12" text-anchor="middle" fill="#1a1a1a">Multi-threaded: delays overlap, not stack</text>

  <rect x="30" y="310" width="330" height="70" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="195" y="335" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Vertical vs. horizontal privesc</text>
  <text x="195" y="355" font-size="12" text-anchor="middle" fill="#1a1a1a">Tier change vs. same-tier new target</text>

  <rect x="380" y="310" width="330" height="70" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="545" y="335" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">nmap closed vs. filtered</text>
  <text x="545" y="355" font-size="12" text-anchor="middle" fill="#1a1a1a">Missed 3x before -- resolved, light re-check only</text>
</svg>
