<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <text x="360" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Session Fixation — Three Steps</text>

  <!-- Step 1 -->
  <text x="20" y="58" font-size="14" font-weight="bold" fill="#1a1a1a">Step 1: Attacker plants a known session ID</text>
  <rect x="20" y="70" width="190" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="115" y="95" font-size="13" text-anchor="middle" fill="#1a1a1a">ATTACKER browser</text>
  <text x="115" y="113" font-size="12" text-anchor="middle" fill="#1a1a1a">visits ?sessionid=X123</text>
  <line x1="210" y1="100" x2="300" y2="100" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="70" width="200" height="60" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="400" y="92" font-size="13" text-anchor="middle" fill="#1a1a1a">Server session store</text>
  <text x="400" y="110" font-size="12" text-anchor="middle" fill="#1a1a1a">X123: logged_in = false</text>

  <!-- Step 2 -->
  <text x="20" y="178" font-size="14" font-weight="bold" fill="#1a1a1a">Step 2: Victim logs in under that same planted ID</text>
  <rect x="20" y="190" width="190" height="60" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="115" y="212" font-size="13" text-anchor="middle" fill="#1a1a1a">VICTIM (same browser,</text>
  <text x="115" y="228" font-size="12" text-anchor="middle" fill="#1a1a1a">same cookie X123)</text>
  <text x="115" y="244" font-size="12" text-anchor="middle" fill="#1a1a1a">logs in as "alice"</text>
  <line x1="210" y1="220" x2="300" y2="220" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="190" width="200" height="60" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="400" y="212" font-size="13" text-anchor="middle" fill="#1a1a1a">Server session store</text>
  <text x="400" y="230" font-size="12" text-anchor="middle" fill="#1a1a1a">X123: logged_in = true</text>
  <text x="400" y="246" font-size="12" text-anchor="middle" fill="#1a1a1a">X123: user = "alice"</text>

  <!-- Step 3 -->
  <text x="20" y="298" font-size="14" font-weight="bold" fill="#1a1a1a">Step 3: Attacker reuses the same ID — instant hijack</text>
  <rect x="20" y="310" width="190" height="70" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="115" y="332" font-size="13" text-anchor="middle" fill="#1a1a1a">ATTACKER — separate</text>
  <text x="115" y="348" font-size="12" text-anchor="middle" fill="#1a1a1a">browser, no cookies,</text>
  <text x="115" y="364" font-size="12" text-anchor="middle" fill="#1a1a1a">revisits ?sessionid=X123</text>
  <line x1="210" y1="345" x2="300" y2="345" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="310" width="200" height="70" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="400" y="335" font-size="13" text-anchor="middle" fill="#1a1a1a">Server response:</text>
  <text x="400" y="353" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">"Welcome, alice!"</text>
  <text x="400" y="369" font-size="11" text-anchor="middle" fill="#1a1a1a">(no password ever seen)</text>

  <text x="360" y="420" font-size="12" text-anchor="middle" fill="#1a1a1a">No theft at any point — the attacker chose ID X123 in advance and simply checked back.</text>
  <text x="360" y="438" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Fix: rotate the session ID at login, and never trust a client-supplied ID.</text>
</svg>
