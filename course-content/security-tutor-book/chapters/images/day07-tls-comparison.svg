<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <text x="350" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Same Login, Two Captures: Plaintext HTTP vs. TLS</text>

  <!-- plaintext lane -->
  <text x="175" y="56" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">Plain HTTP</text>
  <rect x="60" y="70" width="80" height="40" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="100" y="94" font-size="12" text-anchor="middle" fill="#1a1a1a">Client</text>
  <line x1="140" y1="90" x2="210" y2="90" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow7)"/>
  <rect x="210" y="70" width="80" height="40" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="250" y="94" font-size="12" text-anchor="middle" fill="#1a1a1a">Server</text>
  <rect x="40" y="125" width="270" height="55" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="175" y="147" font-size="11" text-anchor="middle" fill="#1a1a1a">tcpdump capture:</text>
  <text x="175" y="164" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a1a">user=alice&amp;pass=hunter2</text>
  <text x="175" y="200" font-size="12" text-anchor="middle" fill="#c0392b">password readable in plain text</text>

  <!-- tls lane -->
  <text x="525" y="56" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e8449">TLS (HTTPS)</text>
  <rect x="410" y="70" width="80" height="40" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="450" y="94" font-size="12" text-anchor="middle" fill="#1a1a1a">Client</text>
  <line x1="490" y1="90" x2="560" y2="90" stroke="#1e8449" stroke-width="2" marker-end="url(#arrow7)"/>
  <rect x="560" y="70" width="80" height="40" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="600" y="94" font-size="12" text-anchor="middle" fill="#1a1a1a">Server</text>
  <rect x="390" y="125" width="270" height="55" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="525" y="147" font-size="11" text-anchor="middle" fill="#1a1a1a">tcpdump capture:</text>
  <text x="525" y="164" font-size="11" font-family="monospace" text-anchor="middle" fill="#1a1a1a">17 03 03 00 ae f1 9c ... (encrypted)</text>
  <text x="525" y="200" font-size="12" text-anchor="middle" fill="#1e8449">grep for the password: zero matches</text>

  <text x="350" y="240" font-size="12" text-anchor="middle" fill="#555">Same username, same password, same login form — the only difference is the transport.</text>
</svg>
