<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <text x="370" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">The Phase 6 Principle, Applied to Five Surfaces</text>

  <rect x="30" y="60" width="200" height="60" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="130" y="85" font-size="13" text-anchor="middle" fill="#1a1a1a">Identity</text>
  <text x="130" y="103" font-size="11" text-anchor="middle" fill="#1a1a1a">IAM least privilege</text>

  <rect x="260" y="60" width="200" height="60" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="360" y="85" font-size="13" text-anchor="middle" fill="#1a1a1a">Org-wide policy</text>
  <text x="360" y="103" font-size="11" text-anchor="middle" fill="#1a1a1a">Service Control Policies</text>

  <rect x="490" y="60" width="220" height="60" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="600" y="85" font-size="13" text-anchor="middle" fill="#1a1a1a">Network</text>
  <text x="600" y="103" font-size="11" text-anchor="middle" fill="#1a1a1a">Security groups, default-deny</text>

  <rect x="140" y="160" width="200" height="60" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="240" y="185" font-size="13" text-anchor="middle" fill="#1a1a1a">Data</text>
  <text x="240" y="203" font-size="11" text-anchor="middle" fill="#1a1a1a">Scoped secrets, rotation</text>

  <rect x="380" y="160" width="220" height="60" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="490" y="185" font-size="13" text-anchor="middle" fill="#1a1a1a">Delegation</text>
  <text x="490" y="203" font-size="11" text-anchor="middle" fill="#1a1a1a">Who can PassRole</text>

  <line x1="130" y1="120" x2="330" y2="260" stroke="#2b2b2b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="120" x2="350" y2="260" stroke="#2b2b2b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="120" x2="400" y2="260" stroke="#2b2b2b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="220" x2="340" y2="260" stroke="#2b2b2b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="220" x2="410" y2="260" stroke="#2b2b2b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="260" width="300" height="70" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="370" y="288" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Default-deny.</text>
  <text x="370" y="306" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Minimal necessary access, actively enforced.</text>

  <text x="370" y="360" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">One event is not proof. A correlated sequence is.</text>
  <rect x="40" y="375" width="140" height="35" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="110" y="397" font-size="12" text-anchor="middle" fill="#1a1a1a">PassRole (alone)</text>
  <line x1="180" y1="392" x2="280" y2="392" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="385" font-size="10" text-anchor="middle" fill="#1a1a1a">+ same identity/IP</text>
  <rect x="280" y="375" width="180" height="35" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="370" y="397" font-size="12" text-anchor="middle" fill="#1a1a1a">CreateFunction (signal)</text>
</svg>
