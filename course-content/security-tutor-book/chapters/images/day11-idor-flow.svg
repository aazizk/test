<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow11" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <text x="360" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">IDOR: Authentication Checked, Ownership Never Asked</text>

  <!-- lanes -->
  <text x="110" y="52" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Alice (logged in)</text>
  <text x="610" y="52" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Server (vulnerable)</text>
  <line x1="110" y1="60" x2="110" y2="330" stroke="#bbb" stroke-width="1"/>
  <line x1="610" y1="60" x2="610" y2="330" stroke="#bbb" stroke-width="1"/>

  <!-- request 1: own profile -->
  <line x1="110" y1="90" x2="602" y2="90" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow11)"/>
  <text x="360" y="83" font-size="11" text-anchor="middle" fill="#1a1a1a">GET /profile?id=1  (Alice's own session)</text>
  <text x="360" y="108" font-size="11" text-anchor="middle" fill="#555">server checks: logged in? yes → return profile 1</text>
  <line x1="610" y1="120" x2="118" y2="120" stroke="#1e8449" stroke-width="2" marker-end="url(#arrow11)"/>
  <text x="360" y="135" font-size="11" text-anchor="middle" fill="#1e8449">200 OK — Alice's own data</text>

  <!-- request 2: tampered id -->
  <line x1="110" y1="180" x2="602" y2="180" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow11)"/>
  <text x="360" y="173" font-size="11" text-anchor="middle" fill="#c0392b">GET /profile?id=2  (same session, id edited)</text>
  <rect x="330" y="195" width="300" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="213" font-size="11" text-anchor="middle" fill="#1a1a1a">server checks: logged in? yes.</text>
  <text x="480" y="230" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">Does id=2 belong to Alice? — never asked</text>
  <line x1="610" y1="255" x2="118" y2="255" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow11)"/>
  <text x="360" y="270" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">200 OK — Bob's private data, via Alice's session</text>

  <!-- fix -->
  <rect x="160" y="295" width="400" height="45" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="360" y="315" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Fix: if requested id != session's own id → 403 Forbidden</text>
  <text x="360" y="332" font-size="10" text-anchor="middle" fill="#555">Ownership check, not just a login check</text>
</svg>
