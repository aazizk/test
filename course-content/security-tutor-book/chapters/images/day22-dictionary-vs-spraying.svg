<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <text x="360" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Dictionary Attack vs. Password Spraying</text>

  <!-- Left: Dictionary attack -->
  <text x="170" y="52" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Dictionary Attack</text>
  <rect x="100" y="70" width="140" height="44" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="170" y="97" font-size="13" text-anchor="middle" fill="#1a1a1a">ATTACKER</text>

  <rect x="100" y="150" width="140" height="44" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="170" y="172" font-size="12" text-anchor="middle" fill="#1a1a1a">admin</text>
  <text x="170" y="187" font-size="11" text-anchor="middle" fill="#1a1a1a">(one account)</text>

  <line x1="170" y1="114" x2="170" y2="150" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="170" y="222" font-size="12" text-anchor="middle" fill="#1a1a1a">password1</text>
  <text x="170" y="238" font-size="12" text-anchor="middle" fill="#1a1a1a">password2</text>
  <text x="170" y="254" font-size="12" text-anchor="middle" fill="#1a1a1a">password3 ...</text>
  <text x="170" y="274" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a1a">many guesses, one target</text>

  <rect x="100" y="286" width="140" height="40" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="170" y="302" font-size="11" text-anchor="middle" fill="#1a1a1a">per-account counter</text>
  <text x="170" y="316" font-size="11" text-anchor="middle" fill="#1a1a1a">trips after N fails</text>

  <!-- Divider -->
  <line x1="360" y1="40" x2="360" y2="340" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right: Password spraying -->
  <text x="550" y="52" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Password Spraying</text>
  <rect x="480" y="70" width="140" height="44" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="550" y="97" font-size="13" text-anchor="middle" fill="#1a1a1a">ATTACKER</text>

  <line x1="505" y1="114" x2="440" y2="150" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="114" x2="550" y2="150" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="595" y1="114" x2="660" y2="150" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="150" width="80" height="40" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="440" y="174" font-size="11" text-anchor="middle" fill="#1a1a1a">alice</text>
  <rect x="510" y="150" width="80" height="40" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="550" y="174" font-size="11" text-anchor="middle" fill="#1a1a1a">bob</text>
  <rect x="620" y="150" width="80" height="40" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="660" y="174" font-size="11" text-anchor="middle" fill="#1a1a1a">carol</text>

  <text x="550" y="222" font-size="12" text-anchor="middle" fill="#1a1a1a">Summer2024!</text>
  <text x="550" y="238" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a1a">one guess per account,</text>
  <text x="550" y="252" font-size="11" font-style="italic" text-anchor="middle" fill="#1a1a1a">then sweep repeats</text>

  <rect x="480" y="286" width="140" height="40" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="550" y="302" font-size="11" text-anchor="middle" fill="#1a1a1a">no account ever</text>
  <text x="550" y="316" font-size="11" text-anchor="middle" fill="#1a1a1a">crosses its own threshold</text>

  <text x="360" y="352" font-size="12" font-style="italic" text-anchor="middle" fill="#1a1a1a">Same attacker goal, different shape — per-account lockout only stops the left side.</text>
</svg>
