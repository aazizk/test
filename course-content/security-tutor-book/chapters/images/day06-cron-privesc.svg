<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <text x="350" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Cron Privilege Escalation: No Exploit Required</text>

  <rect x="40" y="55" width="280" height="55" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="180" y="78" font-size="13" text-anchor="middle" fill="#1a1a1a">Cron entry runs as root</text>
  <text x="180" y="96" font-size="11" text-anchor="middle" fill="#555">e.g. a nightly backup job</text>

  <rect x="380" y="55" width="280" height="55" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="520" y="78" font-size="13" text-anchor="middle" fill="#1a1a1a">…but it executes script.sh,</text>
  <text x="520" y="96" font-size="11" text-anchor="middle" fill="#555">which is world-writable</text>

  <line x1="180" y1="110" x2="180" y2="140" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow6)"/>
  <line x1="520" y1="110" x2="520" y2="140" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow6)"/>
  <line x1="180" y1="140" x2="520" y2="140" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="350" y1="140" x2="350" y2="160" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow6)"/>

  <rect x="200" y="165" width="300" height="55" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="350" y="188" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Any user edits script.sh,</text>
  <text x="350" y="206" font-size="12" text-anchor="middle" fill="#1a1a1a">appends their own command</text>

  <line x1="350" y1="220" x2="350" y2="250" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow6)"/>

  <rect x="200" y="255" width="300" height="50" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="350" y="285" font-size="13" text-anchor="middle" fill="#1a1a1a">Cron fires on its normal schedule</text>

  <line x1="350" y1="305" x2="350" y2="325" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow6)"/>

  <rect x="170" y="328" width="360" height="30" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
  <text x="350" y="348" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Attacker's command runs AS ROOT</text>
</svg>
