<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <text x="320" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Anatomy of an HTTP Request/Response</text>

  <rect x="80" y="50" width="480" height="40" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="320" y="75" font-size="13" text-anchor="middle" fill="#1a1a1a">GET /index.html HTTP/1.1   (method, path, version)</text>

  <rect x="80" y="90" width="480" height="70" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="320" y="112" font-size="13" text-anchor="middle" fill="#1a1a1a">Headers</text>
  <text x="320" y="130" font-size="11" text-anchor="middle" fill="#555">Content-Length: how many bytes of body to expect</text>
  <text x="320" y="146" font-size="11" text-anchor="middle" fill="#555">Content-Type: how to interpret those bytes</text>

  <rect x="80" y="160" width="480" height="24" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="320" y="177" font-size="12" text-anchor="middle" fill="#1a1a1a">blank line — signals "headers are done"</text>

  <rect x="80" y="184" width="480" height="50" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="320" y="214" font-size="13" text-anchor="middle" fill="#1a1a1a">Body (HTML, JSON, image, …)</text>

  <text x="320" y="260" font-size="12" text-anchor="middle" fill="#555">Status codes: 2xx success · 3xx redirect · 4xx client error · 5xx server error</text>
  <text x="320" y="280" font-size="12" text-anchor="middle" fill="#c0392b">403 = exists, access denied.   404 = genuinely not there.</text>
</svg>
