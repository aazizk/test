<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="360" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">PassRole + CreateFunction Escalation Chain</text>

  <!-- User -->
  <rect x="20" y="70" width="140" height="55" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="90" y="93" font-size="13" text-anchor="middle" fill="#1a1a1a">Low-privilege user</text>
  <text x="90" y="110" font-size="11" text-anchor="middle" fill="#1a1a1a">PassRole + CreateFunction only</text>

  <!-- Direct attempt, denied -->
  <line x1="160" y1="80" x2="430" y2="80" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <text x="295" y="72" font-size="11" text-anchor="middle" fill="#c0392b">direct GetSecretValue: implicitDeny</text>

  <!-- Lambda function -->
  <rect x="280" y="150" width="150" height="55" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="355" y="173" font-size="13" text-anchor="middle" fill="#1a1a1a">New Lambda function</text>
  <text x="355" y="190" font-size="11" text-anchor="middle" fill="#1a1a1a">created by the user</text>
  <line x1="90" y1="125" x2="280" y2="165" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="150" font-size="11" fill="#1a1a1a">CreateFunction: allowed</text>

  <!-- Role -->
  <rect x="280" y="240" width="150" height="55" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="355" y="263" font-size="13" text-anchor="middle" fill="#1a1a1a">kafka-tls-testing-role</text>
  <text x="355" y="280" font-size="11" text-anchor="middle" fill="#1a1a1a">trust policy allows Lambda</text>
  <line x1="90" y1="125" x2="280" y2="260" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="220" font-size="11" fill="#1a1a1a">PassRole: allowed</text>
  <line x1="355" y1="205" x2="355" y2="240" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="225" font-size="10" fill="#1a1a1a">assumes</text>

  <!-- Secret/KMS, reached -->
  <rect x="480" y="195" width="180" height="55" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="570" y="218" font-size="13" text-anchor="middle" fill="#1a1a1a">KMS key + Secret</text>
  <text x="570" y="235" font-size="11" text-anchor="middle" fill="#1a1a1a">reached indirectly</text>
  <line x1="430" y1="220" x2="480" y2="220" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="360" y="335" font-size="11" text-anchor="middle" fill="#1a1a1a">Denied directly. Reached anyway, by borrowing a role the user was only ever allowed to pass.</text>
</svg>
