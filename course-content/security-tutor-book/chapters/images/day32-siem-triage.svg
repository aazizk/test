<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <text x="370" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">SIEM Pipeline and the Real Triage Question</text>

  <rect x="20" y="55" width="150" height="55" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="95" y="80" font-size="13" text-anchor="middle" fill="#1a1a1a">Collection</text>
  <text x="95" y="97" font-size="10" text-anchor="middle" fill="#1a1a1a">pull all log sources</text>

  <line x1="170" y1="82" x2="205" y2="82" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="205" y="55" width="150" height="55" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="280" y="80" font-size="13" text-anchor="middle" fill="#1a1a1a">Normalization</text>
  <text x="280" y="97" font-size="10" text-anchor="middle" fill="#1a1a1a">one common schema</text>

  <line x1="355" y1="82" x2="390" y2="82" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="390" y="55" width="150" height="55" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="465" y="80" font-size="13" text-anchor="middle" fill="#1a1a1a">Correlation</text>
  <text x="465" y="97" font-size="10" text-anchor="middle" fill="#1a1a1a">apply pattern rules</text>

  <line x1="540" y1="82" x2="575" y2="82" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="575" y="55" width="150" height="55" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="650" y="80" font-size="13" text-anchor="middle" fill="#1a1a1a">Alerting</text>
  <text x="650" y="97" font-size="10" text-anchor="middle" fill="#1a1a1a">notify a human</text>

  <text x="370" y="165" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Same 3 calls — only the identity differs</text>

  <rect x="80" y="185" width="260" height="90" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="210" y="210" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">WizAccess-Role</text>
  <text x="210" y="228" font-size="11" text-anchor="middle" fill="#1a1a1a">GetAccountPasswordPolicy</text>
  <text x="210" y="243" font-size="11" text-anchor="middle" fill="#1a1a1a">ListAccountAliases</text>
  <text x="210" y="258" font-size="11" text-anchor="middle" fill="#1a1a1a">GetAccountProperties</text>

  <rect x="400" y="185" width="260" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="530" y="210" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">UNKNOWN IDENTITY</text>
  <text x="530" y="228" font-size="11" text-anchor="middle" fill="#1a1a1a">GetAccountPasswordPolicy</text>
  <text x="530" y="243" font-size="11" text-anchor="middle" fill="#1a1a1a">ListAccountAliases</text>
  <text x="530" y="258" font-size="11" text-anchor="middle" fill="#1a1a1a">GetAccountProperties</text>

  <text x="210" y="300" font-size="12" text-anchor="middle" fill="#1a1a1a">Known CSPM scanner --&gt; routine</text>
  <text x="530" y="300" font-size="12" text-anchor="middle" fill="#1a1a1a">Unrecognized actor --&gt; investigate</text>

  <text x="370" y="345" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">The API calls are identical. Identity is the only differentiator.</text>
</svg>
