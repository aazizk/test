<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <text x="360" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Same Spray Attack, Two Defenses</text>

  <!-- Attacker box, shared -->
  <rect x="20" y="55" width="150" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="95" y="76" font-size="13" text-anchor="middle" fill="#1a1a1a">ATTACKER</text>
  <text x="95" y="92" font-size="11" text-anchor="middle" fill="#1a1a1a">1 password x 10 usernames</text>

  <!-- Top path: per-username defense -->
  <text x="400" y="50" font-size="14" font-weight="bold" fill="#1a1a1a">Defense keyed by USERNAME</text>
  <line x1="170" y1="70" x2="300" y2="70" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="55" width="150" height="110" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="375" y="76" font-size="12" text-anchor="middle" fill="#1a1a1a">alice: 1 failure</text>
  <text x="375" y="94" font-size="12" text-anchor="middle" fill="#1a1a1a">bob: 1 failure</text>
  <text x="375" y="112" font-size="12" text-anchor="middle" fill="#1a1a1a">carol: 1 failure</text>
  <text x="375" y="130" font-size="12" text-anchor="middle" fill="#1a1a1a">... (10 usernames)</text>
  <text x="375" y="150" font-size="11" text-anchor="middle" fill="#1a1a1a">each count stays at 1</text>

  <line x1="450" y1="110" x2="560" y2="110" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="80" width="140" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="630" y="105" font-size="13" text-anchor="middle" fill="#1a1a1a">NO BACKOFF</text>
  <text x="630" y="122" font-size="11" text-anchor="middle" fill="#1a1a1a">threshold never crossed</text>

  <!-- Bottom path: per-IP defense -->
  <text x="400" y="200" font-size="14" font-weight="bold" fill="#1a1a1a">Defense keyed by SOURCE IP</text>
  <line x1="170" y1="220" x2="300" y2="220" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="205" width="150" height="110" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="375" y="226" font-size="12" text-anchor="middle" fill="#1a1a1a">attacker IP:</text>
  <text x="375" y="244" font-size="12" text-anchor="middle" fill="#1a1a1a">1, 2, 3 ... 30 failures</text>
  <text x="375" y="262" font-size="12" text-anchor="middle" fill="#1a1a1a">(every request counts)</text>
  <text x="375" y="282" font-size="11" text-anchor="middle" fill="#1a1a1a">counter climbs fast</text>

  <line x1="450" y1="260" x2="560" y2="260" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="230" width="140" height="60" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="630" y="255" font-size="13" text-anchor="middle" fill="#1a1a1a">BACKOFF TRIGGERS</text>
  <text x="630" y="272" font-size="11" text-anchor="middle" fill="#1a1a1a">capped delay, every request</text>

  <text x="360" y="355" font-size="12" text-anchor="middle" fill="#1a1a1a">Same attacker, same 30 requests — the only difference is what the counter tracks.</text>
</svg>
