<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <text x="370" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">AAA's Three Legs, and Who Reads Which Token</text>

  <!-- AAA row -->
  <rect x="30" y="45" width="210" height="60" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="135" y="70" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Authentication</text>
  <text x="135" y="90" font-size="12" text-anchor="middle" fill="#1a1a1a">Who are you</text>

  <rect x="265" y="45" width="210" height="60" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="370" y="70" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Authorization</text>
  <text x="370" y="90" font-size="12" text-anchor="middle" fill="#1a1a1a">What can you do</text>

  <rect x="500" y="45" width="210" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="605" y="70" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Accounting</text>
  <text x="605" y="90" font-size="12" text-anchor="middle" fill="#1a1a1a">What did you do (logged)</text>

  <!-- Divider -->
  <line x1="30" y1="130" x2="710" y2="130" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="370" y="155" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">SAML / OIDC (identity) vs. OAuth (access)</text>

  <!-- SAML -->
  <rect x="30" y="175" width="210" height="100" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="135" y="198" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">SAML assertion</text>
  <text x="135" y="218" font-size="12" text-anchor="middle" fill="#1a1a1a">XML, enterprise login</text>
  <text x="135" y="236" font-size="12" text-anchor="middle" fill="#1a1a1a">Read once by the app</text>
  <text x="135" y="254" font-size="12" text-anchor="middle" fill="#1a1a1a">"this user is verified"</text>

  <!-- OIDC ID token -->
  <rect x="265" y="175" width="210" height="100" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="370" y="198" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">OIDC ID token</text>
  <text x="370" y="218" font-size="12" text-anchor="middle" fill="#1a1a1a">JSON (JWT), modern/mobile</text>
  <text x="370" y="236" font-size="12" text-anchor="middle" fill="#1a1a1a">Read once by the CLIENT</text>
  <text x="370" y="254" font-size="12" text-anchor="middle" fill="#1a1a1a">"this user is verified"</text>

  <!-- OAuth access token -->
  <rect x="500" y="175" width="210" height="100" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="605" y="198" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">OAuth access token</text>
  <text x="605" y="218" font-size="12" text-anchor="middle" fill="#1a1a1a">JWT or opaque string</text>
  <text x="605" y="236" font-size="12" text-anchor="middle" fill="#1a1a1a">Read repeatedly by the API</text>
  <text x="605" y="254" font-size="12" text-anchor="middle" fill="#1a1a1a">"this request is allowed"</text>

  <text x="370" y="310" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Same identity job, different plumbing. Different reader, different purpose.</text>

  <!-- Replay protection note -->
  <rect x="130" y="335" width="480" height="80" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="370" y="360" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Expiry alone does not stop replay</text>
  <text x="370" y="380" font-size="12" text-anchor="middle" fill="#1a1a1a">exp is signed (tamper-proof) and checked vs. the SERVER'S clock</text>
  <text x="370" y="398" font-size="12" text-anchor="middle" fill="#1a1a1a">A nonce catches reuse of a still-valid captured token</text>
</svg>
