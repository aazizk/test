<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <text x="350" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">AWS Policy Evaluation Logic</text>

  <!-- SCP ceiling -->
  <rect x="80" y="55" width="540" height="60" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="350" y="80" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">SERVICE CONTROL POLICY (SCP) — the ceiling</text>
  <text x="350" y="100" font-size="13" text-anchor="middle" fill="#1a1a1a">Never grants on its own; can only restrict what's possible below</text>

  <line x1="350" y1="115" x2="350" y2="145" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 1: implicit deny -->
  <rect x="120" y="150" width="460" height="55" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="2"/>
  <text x="350" y="172" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">1. IMPLICIT DENY (default)</text>
  <text x="350" y="192" font-size="13" text-anchor="middle" fill="#1a1a1a">Nothing says yes &#8594; the answer is no</text>

  <line x1="350" y1="205" x2="350" y2="235" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: explicit allow -->
  <rect x="120" y="240" width="460" height="55" rx="6" fill="#eaf2fb" stroke="#2874a6" stroke-width="2"/>
  <text x="350" y="262" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2. EXPLICIT ALLOW (required)</text>
  <text x="350" y="282" font-size="13" text-anchor="middle" fill="#1a1a1a">Identity-based or resource-based policy opens access</text>

  <line x1="350" y1="295" x2="350" y2="325" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: explicit deny -->
  <rect x="120" y="330" width="460" height="55" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="350" y="352" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">3. EXPLICIT DENY (always wins)</text>
  <text x="350" y="372" font-size="13" text-anchor="middle" fill="#1a1a1a">Overrides any Allow, from any layer, no exceptions</text>

  <line x1="350" y1="385" x2="350" y2="410" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="415" width="260" height="35" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="2"/>
  <text x="350" y="438" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FINAL DECISION</text>
</svg>
