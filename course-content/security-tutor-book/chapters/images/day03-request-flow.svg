<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <text x="380" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">From URL Bar to Loaded Page: The Full Request Chain</text>

  <rect x="20" y="70" width="160" height="80" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="100" y="100" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">1. DNS Lookup</text>
  <text x="100" y="120" font-size="11" text-anchor="middle" fill="#555">name → IP address</text>
  <text x="100" y="136" font-size="11" text-anchor="middle" fill="#555">(A / AAAA, over UDP)</text>

  <line x1="180" y1="110" x2="208" y2="110" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="210" y="70" width="160" height="80" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="290" y="100" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2. Routing/Delivery</text>
  <text x="290" y="120" font-size="11" text-anchor="middle" fill="#555">local? ARP direct.</text>
  <text x="290" y="136" font-size="11" text-anchor="middle" fill="#555">remote? gateway hops</text>

  <line x1="370" y1="110" x2="398" y2="110" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="400" y="70" width="160" height="80" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="480" y="100" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">3. TCP Handshake</text>
  <text x="480" y="120" font-size="11" text-anchor="middle" fill="#555">SYN → SYN-ACK → ACK</text>
  <text x="480" y="136" font-size="11" text-anchor="middle" fill="#555">connection now open</text>

  <line x1="560" y1="110" x2="588" y2="110" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="590" y="70" width="150" height="80" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="665" y="100" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">4. HTTP</text>
  <text x="665" y="120" font-size="11" text-anchor="middle" fill="#555">request sent,</text>
  <text x="665" y="136" font-size="11" text-anchor="middle" fill="#555">response renders page</text>

  <text x="380" y="195" font-size="12" text-anchor="middle" fill="#555">Each step is also a place something can break, or be attacked:</text>
  <text x="380" y="215" font-size="12" text-anchor="middle" fill="#555">DNS spoofing · routing manipulation · SYN floods · HTTP tampering</text>
</svg>
