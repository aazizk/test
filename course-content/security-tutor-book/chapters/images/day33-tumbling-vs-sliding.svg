<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <text x="350" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Tumbling Window vs. Sliding Window</text>

  <!-- Tumbling window row -->
  <text x="20" y="60" font-size="15" font-weight="bold" fill="#1a1a1a">Tumbling window (fixed boundary)</text>
  <line x1="20" y1="80" x2="680" y2="80" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="75" font-size="12" text-anchor="end" fill="#1a1a1a">time</text>

  <rect x="60" y="65" width="260" height="30" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="190" y="85" font-size="12" text-anchor="middle" fill="#1a1a1a">Window A (0:00-5:00)</text>

  <rect x="320" y="65" width="260" height="30" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="450" y="85" font-size="12" text-anchor="middle" fill="#1a1a1a">Window B (5:00-10:00)</text>

  <circle cx="300" cy="80" r="5" fill="#c0392b"/>
  <circle cx="330" cy="80" r="5" fill="#c0392b"/>
  <text x="315" y="55" font-size="11" text-anchor="middle" fill="#c0392b">2 events, 1 min apart</text>
  <text x="315" y="115" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">Split across boundary -- missed as one burst</text>

  <!-- Sliding window row -->
  <text x="20" y="190" font-size="15" font-weight="bold" fill="#1a1a1a">Sliding window (re-extends on each match)</text>
  <line x1="20" y1="210" x2="680" y2="210" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="205" font-size="12" text-anchor="end" fill="#1a1a1a">time</text>

  <rect x="270" y="195" width="90" height="30" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="315" y="215" font-size="11" text-anchor="middle" fill="#1a1a1a">window opens</text>

  <circle cx="300" cy="210" r="5" fill="#1e8449"/>
  <circle cx="330" cy="210" r="5" fill="#1e8449"/>
  <text x="315" y="245" font-size="12" text-anchor="middle" fill="#1e8449" font-weight="bold">Same 2 events -- window stretches to cover both</text>

  <rect x="20" y="280" width="660" height="60" rx="6" fill="#f2f4f7" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="350" y="305" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Tumbling: simple, catches tight/fast bursts.</text>
  <text x="350" y="325" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Sliding: catches a slower, paced attacker a tumbling window would miss.</text>
</svg>
